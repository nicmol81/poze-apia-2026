<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poze APIA 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  .panel {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.3);
    width: 250px; font-size: 13px;
  }
  .panel-body { max-height: calc(90vh - 40px); overflow-y: auto; }
  .panel h3 {
    margin: 0; padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #eee;
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .arrow { font-size: 11px; color: #888; transition: transform .2s; flex-shrink: 0; display: inline-block; }
  .panel.collapsed h3 { border-bottom: none; }
  .panel.collapsed h3 .arrow { transform: rotate(-90deg); }
  .panel.collapsed .panel-body { display: none; }

  /* nivel 1: sectiuni (Parcele / Poze pe zile) */
  .section-title {
    padding: 8px 12px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #999;
    display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none;
  }
  .section-title .arrow { transform: rotate(0deg); }
  .section-title.collapsed .arrow { transform: rotate(-90deg); }
  .section-body.collapsed { display: none; }

  /* nivel 2: grup (ferma / zi) */
  .group-header {
    display: flex; align-items: center; gap: 6px; padding: 4px 12px; cursor: pointer;
  }
  .group-header:hover { background: #f5f5f5; }
  .group-header .arrow { transform: rotate(0deg); }
  .group-header.collapsed .arrow { transform: rotate(-90deg); }
  .group-header .count { margin-left: auto; color: #888; font-size: 11px; }
  .group-items { padding-left: 4px; }
  .group-items.collapsed { display: none; }

  /* nivel 3: element individual (parcela / poza) */
  .item-row {
    display: flex; align-items: center; gap: 6px; padding: 2px 12px 2px 30px; cursor: pointer; font-size: 12px;
  }
  .item-row:hover { background: #f5f5f5; }
  .item-row span.label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .panel .actions { padding: 6px 12px; border-top: 1px solid #eee; display: flex; gap: 8px; }
  .panel .actions button { font-size: 11px; padding: 3px 8px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fafafa; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; background: #d9534f; flex-shrink: 0; }
  .swatch.square { border-radius: 2px; }
  .leaflet-popup-content a { color: #1a73e8; }
  .total { padding: 8px 12px; color: #555; border-top: 1px solid #eee; font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="panel">
  <h3 id="panelToggle">Poze APIA 2026 <span class="arrow">▼</span></h3>

  <div class="panel-body">
    <div class="section-title" id="sectionParcele" data-target="parcelBody"><span class="arrow">▼</span><span>Parcele</span></div>
    <div class="section-body" id="parcelBody"></div>

    <div class="section-title" id="sectionPoze" data-target="layerBody"><span class="arrow">▼</span><span>Poze pe zile</span></div>
    <div class="section-body" id="layerBody">
      <div class="actions">
        <button id="showAll">Arată tot</button>
        <button id="hideAll">Ascunde tot</button>
      </div>
      <div id="layerList"></div>
    </div>
    <div class="total" id="totalCount"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="data.geojson.js"></script>
<script src="parcels.geojson.js"></script>
<script>
const map = L.map('map', { preferCanvas: true });

const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri', maxZoom: 20
});
const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
});
satellite.addTo(map);
L.control.layers({ 'Satelit': satellite, 'Străzi': streets }, null, { position: 'bottomleft' }).addTo(map);

const cameraIcon = L.divIcon({
  className: '',
  html: '<div style="width:14px;height:14px;border-radius:50%;background:#d9534f;border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.6);"></div>',
  iconSize: [14, 14], iconAnchor: [7, 7]
});

const allBounds = [];

// ---- Parcele (poligoane) -- adaugate primele, ca sa stea sub markerii de poze ----
// grupul featureGroup al fiecarei ferme ramane MEREU pe harta; vizibilitatea per-parcela
// se controleaza adaugand/scotand poligonul individual din grup (addLayer/removeLayer).
const parcelGroups = {};   // farmId -> L.featureGroup (mereu pe harta)
const parcelLayers = {};   // farmId -> [ { layer, name } ]
const parcelBodyEl = document.getElementById('parcelBody');
let totalParcels = 0;
const parcelHtmlParts = [];

for (const farmId of Object.keys(PARCEL_DATA)) {
  const farm = PARCEL_DATA[farmId];
  const group = L.featureGroup();
  const layers = [];
  for (const feat of farm.features) {
    const latlngs = feat.geometry.coordinates[0].map(([lon, lat]) => [lat, lon]);
    const poly = L.polygon(latlngs, {
      color: farm.color, weight: 2, fillColor: farm.color, fillOpacity: 0.12
    });
    const name = feat.properties.name;
    const crop = feat.properties.crop;
    poly.bindPopup(`<b>${name}</b>${crop ? '<br>' + crop : ''}`);
    group.addLayer(poly);
    layers.push({ layer: poly, name });
    allBounds.push(...latlngs);
  }
  totalParcels += farm.features.length;
  parcelGroups[farmId] = group;
  parcelLayers[farmId] = layers;
  group.addTo(map);

  parcelHtmlParts.push(`
    <div class="group">
      <div class="group-header" data-role="group-toggle" data-target="farmItems-${farmId}">
        <span class="arrow">▼</span>
        <input type="checkbox" checked data-role="farm-all" data-farm="${farmId}">
        <span class="swatch square" style="background:${farm.color}"></span>
        <span>${farm.label}</span>
        <span class="count">${farm.features.length}</span>
      </div>
      <div class="group-items collapsed" id="farmItems-${farmId}">
        ${layers.map((l, idx) => {
          const short = (l.name.split(' - ')[1]) || l.name;
          return `<div class="item-row"><input type="checkbox" checked data-role="parcel-item" data-farm="${farmId}" data-idx="${idx}"><span class="label" title="${l.name}">${short}</span></div>`;
        }).join('')}
      </div>
    </div>`);
}
parcelBodyEl.innerHTML = parcelHtmlParts.join('');

function setFarmAllCheckbox(farmId) {
  const cb = parcelBodyEl.querySelector(`input[data-role="farm-all"][data-farm="${farmId}"]`);
  const items = parcelBodyEl.querySelectorAll(`input[data-role="parcel-item"][data-farm="${farmId}"]`);
  let checkedCount = 0;
  items.forEach(i => { if (i.checked) checkedCount++; });
  if (checkedCount === 0) { cb.checked = false; cb.indeterminate = false; }
  else if (checkedCount === items.length) { cb.checked = true; cb.indeterminate = false; }
  else { cb.checked = false; cb.indeterminate = true; }
}

parcelBodyEl.addEventListener('click', (e) => {
  const header = e.target.closest('[data-role="group-toggle"]');
  if (header && e.target.tagName !== 'INPUT') {
    header.classList.toggle('collapsed');
    document.getElementById(header.getAttribute('data-target')).classList.toggle('collapsed');
  }
});

parcelBodyEl.addEventListener('change', (e) => {
  const cb = e.target;
  if (!cb.matches('input[type=checkbox]')) return;
  const farmId = cb.getAttribute('data-farm');
  if (cb.getAttribute('data-role') === 'farm-all') {
    const items = parcelBodyEl.querySelectorAll(`input[data-role="parcel-item"][data-farm="${farmId}"]`);
    items.forEach((item, idx) => {
      item.checked = cb.checked;
      const rec = parcelLayers[farmId][idx];
      if (cb.checked) parcelGroups[farmId].addLayer(rec.layer);
      else parcelGroups[farmId].removeLayer(rec.layer);
    });
    cb.indeterminate = false;
  } else if (cb.getAttribute('data-role') === 'parcel-item') {
    const idx = parseInt(cb.getAttribute('data-idx'), 10);
    const rec = parcelLayers[farmId][idx];
    if (cb.checked) parcelGroups[farmId].addLayer(rec.layer);
    else parcelGroups[farmId].removeLayer(rec.layer);
    setFarmAllCheckbox(farmId);
  }
});

// ---- Poze (markere) -- grupate pe zi ----
const byFolder = {};
for (const f of MAP_DATA.features) {
  const key = f.properties.folder;
  (byFolder[key] = byFolder[key] || []).push(f);
}
const folderNames = Object.keys(byFolder).sort();

const clusterGroups = {};  // folder -> L.markerClusterGroup (mereu pe harta)
const photoLayers = {};    // folder -> [ { layer, name, link } ]
const layerListEl = document.getElementById('layerList');
const layerHtmlParts = [];

for (const folder of folderNames) {
  const cluster = L.markerClusterGroup({ maxClusterRadius: 60, disableClusteringAtZoom: 17 });
  const layers = [];
  for (const feat of byFolder[folder]) {
    const [lon, lat] = feat.geometry.coordinates;
    const m = L.marker([lat, lon], { icon: cameraIcon });
    const name = feat.properties.name;
    const link = feat.properties.link;
    m.bindPopup(`<b>${name}</b><br><a href="${link}" target="_blank" rel="noopener">Deschide poza in Drive</a>`);
    cluster.addLayer(m);
    layers.push({ layer: m, name, link });
    allBounds.push([lat, lon]);
  }
  clusterGroups[folder] = cluster;
  photoLayers[folder] = layers;
  cluster.addTo(map);

  layerHtmlParts.push(`
    <div class="group">
      <div class="group-header" data-role="group-toggle" data-target="dayItems-${folder}">
        <span class="arrow">▼</span>
        <input type="checkbox" checked data-role="day-all" data-folder="${folder}">
        <span class="swatch"></span>
        <span>${folder}</span>
        <span class="count">${byFolder[folder].length}</span>
      </div>
      <div class="group-items collapsed" id="dayItems-${folder}">
        ${layers.map((l, idx) => `<div class="item-row"><input type="checkbox" checked data-role="photo-item" data-folder="${folder}" data-idx="${idx}"><span class="label" title="${l.name}">${l.name}</span></div>`).join('')}
      </div>
    </div>`);
}
layerListEl.innerHTML = layerHtmlParts.join('');

function setDayAllCheckbox(folder) {
  const cb = layerListEl.querySelector(`input[data-role="day-all"][data-folder="${folder}"]`);
  const items = layerListEl.querySelectorAll(`input[data-role="photo-item"][data-folder="${folder}"]`);
  let checkedCount = 0;
  items.forEach(i => { if (i.checked) checkedCount++; });
  if (checkedCount === 0) { cb.checked = false; cb.indeterminate = false; }
  else if (checkedCount === items.length) { cb.checked = true; cb.indeterminate = false; }
  else { cb.checked = false; cb.indeterminate = true; }
}

layerListEl.addEventListener('click', (e) => {
  const header = e.target.closest('[data-role="group-toggle"]');
  if (header && e.target.tagName !== 'INPUT') {
    header.classList.toggle('collapsed');
    document.getElementById(header.getAttribute('data-target')).classList.toggle('collapsed');
  }
});

layerListEl.addEventListener('change', (e) => {
  const cb = e.target;
  if (!cb.matches('input[type=checkbox]')) return;
  const folder = cb.getAttribute('data-folder');
  if (cb.getAttribute('data-role') === 'day-all') {
    const items = layerListEl.querySelectorAll(`input[data-role="photo-item"][data-folder="${folder}"]`);
    items.forEach((item, idx) => {
      item.checked = cb.checked;
      const rec = photoLayers[folder][idx];
      if (cb.checked) clusterGroups[folder].addLayer(rec.layer);
      else clusterGroups[folder].removeLayer(rec.layer);
    });
    cb.indeterminate = false;
  } else if (cb.getAttribute('data-role') === 'photo-item') {
    const idx = parseInt(cb.getAttribute('data-idx'), 10);
    const rec = photoLayers[folder][idx];
    if (cb.checked) clusterGroups[folder].addLayer(rec.layer);
    else clusterGroups[folder].removeLayer(rec.layer);
    setDayAllCheckbox(folder);
  }
});

document.getElementById('showAll').onclick = () => {
  layerListEl.querySelectorAll('input[data-role="day-all"]').forEach(cb => {
    cb.checked = true;
    cb.dispatchEvent(new Event('change', { bubbles: true }));
  });
};
document.getElementById('hideAll').onclick = () => {
  layerListEl.querySelectorAll('input[data-role="day-all"]').forEach(cb => {
    cb.checked = false;
    cb.dispatchEvent(new Event('change', { bubbles: true }));
  });
};

document.getElementById('totalCount').textContent = MAP_DATA.features.length + ' poze in ' + folderNames.length + ' zile, ' + totalParcels + ' parcele';

if (allBounds.length) {
  map.fitBounds(allBounds, { padding: [30, 30] });
} else {
  map.setView([45.9, 24.9], 7);
}

document.getElementById('panelToggle').addEventListener('click', () => {
  document.getElementById('panel').classList.toggle('collapsed');
});

// colapsare nivel 1: sectiunile Parcele / Poze pe zile
document.querySelectorAll('.section-title').forEach(el => {
  el.addEventListener('click', () => {
    el.classList.toggle('collapsed');
    document.getElementById(el.getAttribute('data-target')).classList.toggle('collapsed');
  });
});
</script>
</body>
</html>
