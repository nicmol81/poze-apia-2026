document.getElementById('statParcels').textContent = DATA.parcels.length;
document.getElementById('statPhotos').textContent = DATA.totalPhotos;

const map = L.map('map', {zoomControl:true});

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
});

const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19,
  attribution:'Tiles &copy; Esri'
}).addTo(map);

L.control.layers({"Harta":osm, "Satelit":sat}).addTo(map);

const bounds = [];
const parcelColors = ['#c81400','#78ff00','#0078ff','#f0ff14','#f01414','#008c14','#1478ff','#a078f0','#ff7878','#143c96'];
let colorIdx = 0;

DATA.parcels.forEach(parcel => {
  const color = parcelColors[colorIdx % parcelColors.length];
  colorIdx++;

  const poly = L.polygon(parcel.poly, {
    color: color,
    weight: 2,
    fillColor: color,
    fillOpacity: 0.08
  }).addTo(map);

  poly.bindPopup(
    `<div class="parcel-pop"><b>${parcel.name}</b><br><span class="crop">${parcel.crop}</span>` +
    `<div class="count">${parcel.photos.length} poz${parcel.photos.length===1?'a':'e'} in interior</div></div>`
  );

  parcel.poly.forEach(p => bounds.push(p));

  parcel.photos.forEach(photo => {
    const marker = L.circleMarker([photo.lat, photo.lon], {
      radius: 6,
      color: '#ffffff',
      weight: 2,
      fillColor: '#c88a1e',
      fillOpacity: 1
    }).addTo(map);

    const thumbUrl = `https://drive.google.com/thumbnail?id=${photo.fileId}&sz=w300`;

    marker.bindTooltip(
      `<img src="${thumbUrl}" loading="lazy" alt="${photo.name}">` +
      `<div class="cap">${photo.name}</div>` +
      `<span class="fold">${photo.folder}</span>`,
      {direction:'top', offset:[0,-8], className:'thumb-tip', opacity:1}
    );

    marker.on('click', () => window.open(photo.link, '_blank'));
  });
});

if (bounds.length) {
  map.fitBounds(bounds, {padding:[30,30]});
} else {
  map.setView([44.83, 24.31], 13);
}
